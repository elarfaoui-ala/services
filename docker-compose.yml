services:
  # ── API Gateway ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - '${GATEWAY_PORT:-80}:80'
      - '${GATEWAY_SSL_PORT:-443}:443'
    depends_on:
      auth-backend:
        condition: service_healthy
      notification-backend:
        condition: service_healthy
      dashboard-backend:
        condition: service_healthy
      ai-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', '--no-check-certificate', 'https://localhost/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Shared Infrastructure ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-auth_module}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '$REDIS_PASSWORD', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Auth Module ────────────────────────────────────────────────────────────
  auth-backend:
    build:
      context: .
      dockerfile: auth-module/backend/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: auth-module
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-auth_module}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
    expose:
      - '4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  auth-frontend:
    build:
      context: .
      dockerfile: auth-module/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL:-http://localhost}/api
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      auth-backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Notification Module ────────────────────────────────────────────────────
  notification-backend:
    build:
      context: .
      dockerfile: notification-module/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: notification-module
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 4001
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      API_KEY: ${API_KEY:?Set API_KEY in .env}
    expose:
      - '4001'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4001/api/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  notification-frontend:
    build:
      context: .
      dockerfile: notification-module/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL:-http://localhost}/api
        NEXT_PUBLIC_WS_URL: ${PUBLIC_BASE_URL:-http://localhost}
    restart: unless-stopped
    ports:
      - '3002:3000'
    depends_on:
      notification-backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Dashboard Module ──────────────────────────────────────────────────────
  dashboard-backend:
    build:
      context: .
      dockerfile: dashboard-module/Dockerfile.backend
    restart: unless-stopped
    environment:
      SERVICE_NAME: dashboard-module
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 4002
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    expose:
      - '4002'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4002/api/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard-frontend:
    build:
      context: .
      dockerfile: dashboard-module/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL:-http://localhost}/api
    restart: unless-stopped
    ports:
      - '3001:3000'
    depends_on:
      dashboard-backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── AI Module ─────────────────────────────────────────────────────────────
  ai-backend:
    build:
      context: .
      dockerfile: ai-module/backend/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: ai-module
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 4003
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    expose:
      - '4003'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4003/api/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  ai-frontend:
    build:
      context: .
      dockerfile: ai-module/frontend/Dockerfile
      args:
        NEXT_PUBLIC_AI_API_URL: ${PUBLIC_BASE_URL:-http://localhost}/api
        NEXT_PUBLIC_AUTH_URL: ${PUBLIC_BASE_URL:-http://localhost}/api
    restart: unless-stopped
    ports:
      - '3003:3000'
    depends_on:
      ai-backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Monitoring ─────────────────────────────────────────────────────────────
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1
    restart: unless-stopped
    command:
      - '--nginx.scrape-uri=http://gateway:8080/stub_status'
    depends_on:
      gateway:
        condition: service_healthy
    expose:
      - '9113'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9113/metrics']
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9090/-/healthy']
      interval: 10s
      timeout: 5s
      retries: 3

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - '${ALERTMANAGER_PORT:-9094}:9093'
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9093/-/healthy']
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '${GRAFANA_PORT:-3004}:3000'
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
