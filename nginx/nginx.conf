worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    keepalive_timeout  65;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── SSL Defaults ──────────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Rate Limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # ── Upstream Services ─────────────────────────────────────────────────────
    # X-Request-ID is forwarded through all proxies for distributed tracing.
    # Each backend generates its own if not present.
    upstream auth_backend {
        server auth-backend:4000;
    }

    upstream notification_backend {
        server notification-backend:4001;
    }

    upstream dashboard_backend {
        server dashboard-backend:4002;
    }

    upstream ai_backend {
        server ai-backend:4003;
    }

    # ── Stub Status (for nginx-prometheus-exporter) ────────────────────────────
    server {
        listen 8080;
        server_name _;

        location /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;   # Docker internal network
            deny all;
        }
    }

    # ── HTTP → HTTPS Redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Server ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # HSTS (comment out during dev if it causes issues)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Client max body size (for AI summarize large texts)
        client_max_body_size 1m;

        # ── Auth Module ──────────────────────────────────────────────────
        location /api/auth/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://auth_backend/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # ── Notification Module ──────────────────────────────────────────
        location /api/notifications/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://notification_backend/api/notifications/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # ── Dashboard Module ─────────────────────────────────────────────
        location /api/dashboard/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://dashboard_backend/api/dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # ── AI Module ────────────────────────────────────────────────────
        location /api/ai/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://ai_backend/api/ai/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # SSE streaming support
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # ── WebSocket (Notifications, socket.io) ─────────────────────────
        location /socket.io/ {
            proxy_pass http://notification_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 86400;
        }

        # ── Health Check ─────────────────────────────────────────────────
        location /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"nginx","ssl":true}';
        }

        # ── Default ──────────────────────────────────────────────────────
        location / {
            default_type application/json;
            return 404 '{"error":"Not found","hint":"Available: /api/auth/*, /api/notifications/*, /api/dashboard/*, /api/ai/*"}';
        }
    }
}
