global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: 'auth-backend'
    static_configs:
      - targets: ['auth-backend:4000']
    metrics_path: '/api/metrics'

  - job_name: 'notification-backend'
    static_configs:
      - targets: ['notification-backend:4001']
    metrics_path: '/api/metrics'

  - job_name: 'dashboard-backend'
    static_configs:
      - targets: ['dashboard-backend:4002']
    metrics_path: '/api/metrics'

  - job_name: 'ai-backend'
    static_configs:
      - targets: ['ai-backend:4003']
    metrics_path: '/api/metrics'

  - job_name: 'nginx-gateway'
    static_configs:
      - targets: ['nginx-exporter:9113']
    metrics_path: '/metrics'

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    metrics_path: '/metrics'
