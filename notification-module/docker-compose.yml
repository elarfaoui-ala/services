services:
  backend:
    build:
      context: ..
      dockerfile: notification-module/Dockerfile
    ports:
      - "${NOTIFICATION_PORT:-4001}:4001"
    environment:
      PORT: ${NOTIFICATION_PORT:-4001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      API_KEY: ${API_KEY:-}
    restart: unless-stopped
