name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check

  shared-core:
    name: Shared Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck --workspace @services/core

  auth-module:
    name: Auth Module
    runs-on: ubuntu-latest
    needs: [shared-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace @services/auth-backend
      - run: npm run test --workspace @services/auth-backend

  notification-module:
    name: Notification Module
    runs-on: ubuntu-latest
    needs: [shared-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace @services/notification-backend
      - run: npm run test --workspace @services/notification-backend

  dashboard-module:
    name: Dashboard Module
    runs-on: ubuntu-latest
    needs: [shared-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace @services/dashboard-backend
      - run: npm run test --workspace @services/dashboard-backend
      - run: npm run build --workspace @services/dashboard-frontend
      - run: npm run test --workspace @services/dashboard-frontend

  ai-module:
    name: AI Module
    runs-on: ubuntu-latest
    needs: [shared-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace @services/ai-backend
      - run: npm run test --workspace @services/ai-backend

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [auth-module, notification-module, dashboard-module, ai-module]
    steps:
      - uses: actions/checkout@v4
      - name: Build Auth Backend
        run: docker build -t auth-backend -f ./auth-module/backend/Dockerfile .
      - name: Build Auth Frontend
        run: docker build -t auth-frontend -f ./auth-module/frontend/Dockerfile .
      - name: Build Notification Backend
        run: docker build -t notification-backend -f ./notification-module/Dockerfile .
      - name: Build Notification Frontend
        run: docker build -t notification-frontend -f ./notification-module/frontend/Dockerfile .
      - name: Build Dashboard Backend
        run: docker build -t dashboard-backend -f ./dashboard-module/Dockerfile.backend .
      - name: Build Dashboard Frontend
        run: docker build -t dashboard-frontend -f ./dashboard-module/Dockerfile.frontend .
      - name: Build AI Backend
        run: docker build -t ai-backend -f ./ai-module/backend/Dockerfile .
      - name: Build AI Frontend
        run: docker build -t ai-frontend -f ./ai-module/frontend/Dockerfile .
      - name: Build Nginx Gateway
        run: docker build -t gateway ./nginx
