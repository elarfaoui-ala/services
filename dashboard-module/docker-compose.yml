services:
  backend:
    build:
      context: ..
      dockerfile: dashboard-module/Dockerfile.backend
    ports:
      - '4002:4002'
    environment:
      PORT: 4002
      FRONTEND_URL: http://localhost:3000

  frontend:
    build:
      context: ..
      dockerfile: dashboard-module/Dockerfile.frontend
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4002/api
    depends_on:
      - backend
